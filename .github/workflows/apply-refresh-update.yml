name: Apply reviewed six-hour refresh update
on:
  push:
    branches: ['fix/six-hour-manual-refresh-20261117']
    paths: ['.github/workflows/apply-refresh-update.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply reviewed source-hash guarded client patch
        run: |
          curl --fail --silent --show-error --location 'https://raw.githubusercontent.com/hanuri2000-svg/star-match-manager/ed25d0abaf5f29ca2aba286a06fdaafebd9a480f/.maintenance/apply-client-refresh.py' -o /tmp/apply-client-refresh.py
          python /tmp/apply-client-refresh.py
      - name: Synchronize canonical Worker and validate both implementations
        run: |
          cd worker
          npm run sync:upstream
          npm test
      - name: Verify journal refresh and original interface
        run: |
          node --test tests/*.test.mjs
          python -m pip install playwright==1.56.0
          python tests/elo-public-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-hour-refresh-browser-checks
          path: test-results/elo-public-smoke/
          retention-days: 7
      - name: Commit tested application and canonical mirror files only
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js elo-public.js index.html sw.js version.json tests worker
          git commit -m 'Use six-hour refresh with explicit and browser reload updates'
          git push origin HEAD:refs/heads/fix/six-hour-manual-refresh-20261117
