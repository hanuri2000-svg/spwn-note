name: Apply verified local statistics patch
on:
  push:
    branches: ['feat/12h-ladder-notes-20261116']
    paths: ['.github/workflows/apply-statistics-local.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/feat/12h-ladder-notes-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply exact verified shared source patch
        env:
          PATCH1: 
          PATCH2: 
        run: |
          python - <<'PY'
          import os,base64,lzma,hashlib,subprocess
          patch=lzma.decompress(base64.b64decode(os.environ['PATCH1']+os.environ['PATCH2']))
          assert hashlib.sha256(patch).hexdigest()=='22dc8ec9a03038a02e080f13bff4343a775767f1373523623ce66ddab1ba5735'
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          PY
      - name: Update local integration and version
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/elo-public-smoke.py');s=p.read_text()
          s=s.replace('import asyncio\n','import asyncio\nimport os\n',1)
          s=s.replace('async def wait_total(page, total=38):','async def wait_total(page, total=39):')
          s=s.replace("await context.add_init_script('localStorage.setItem(' + json.dumps(key) + ',' + json.dumps(raw) + ');')", "await context.add_init_script('if(localStorage.getItem(' + json.dumps(key) + ')===null)localStorage.setItem(' + json.dumps(key) + ',' + json.dumps(raw) + ');')")
          a=s.index("        await page.locator('[data-elo-source]').select_option('local')")
          b=s.index("        assert len([url for url in state['requests'] if '/summary?'",a)
          s=s[:a]+"        assert await page.locator('[data-elo-source]').count() == 0\n        assert '래더 1판' in await page.locator('[data-elo-combined-label]').inner_text()\n        await wait_total(page)\n"+s[b:]
          s=s.replace("assert await page.locator('#recordsTable button').count() == 0", "assert await page.locator('#recordsTable [data-elo-note]').count() == 50\n    assert await page.locator('#recordsTable button.danger').count() == 0")
          s=s.replace('browser = await playwright.chromium.launch()', "browser = await playwright.chromium.launch(executable_path=os.environ.get('PLAYWRIGHT_CHROMIUM_EXECUTABLE'))")
          p.write_text(s)
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='ac3bc80521335cde5d152b606e9b685e6373a873226986c78c0b9c4aa4895dae'
          for name in ['app.js','index.html','sw.js','version.json']:
              p=Path(name);p.write_text(p.read_text().replace('2.2.13','2.2.14'))
          PY
      - name: Synchronize canonical Worker mirror
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd worker
          npm run sync:upstream
          node -e "const l=require('./upstream-lock.json');if(l.revision!=='0ea18c5aec7c5b3f757ab6df8d23de54949c5f3b')throw Error('Canonical source moved');"
          npm run check:upstream
      - name: Test and commit feature branch
        run: |
          node --test tests/*.test.mjs worker/tests/*.test.mjs
          git add app.js index.html sw.js version.json elo-public.js tests/elo-public.test.mjs tests/elo-public-smoke.py worker/package.json worker/src worker/tests worker/upstream-lock.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Combine ladder in statistics, refresh after 12 hours, and sync Worker'
          git push origin HEAD:refs/heads/feat/12h-ladder-notes-20261116
